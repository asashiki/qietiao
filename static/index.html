<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>切条 · X 视频连环</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="mast">
    <div class="mast-copy">
      <p class="eyebrow">Splicer for X</p>
      <h1>切条</h1>
    </div>
    <p class="health" id="health"></p>
  </header>

  <main class="bench">
    <aside class="chest">
      <form id="form" class="chest-form" autocomplete="off">
        <section class="tool">
          <h2>片源</h2>
          <label class="drop" id="drop">
            <input id="file" type="file" accept="video/*,image/*,.mp4,.mov,.webm,.mkv,.gif,.png,.jpg,.jpeg,.webp">
            <span class="drop-kicker">放下视频或图片</span>
            <span class="drop-sub" id="fileLabel">点这里选，或贴路径</span>
          </label>
          <label class="path-label">本地路径
            <input id="path" type="text" placeholder="C:\Users\…\成片.mp4" spellcheck="false">
          </label>
          <button type="button" class="ghost" id="openBtn">读入</button>
          <p class="meta" id="mediaMeta"></p>
        </section>

        <section class="tool">
          <h2>切法</h2>
          <div class="seg" role="radiogroup" aria-label="切法">
            <button type="button" class="seg-btn on" data-layout="clean">整段</button>
            <button type="button" class="seg-btn" data-layout="carousel">横滑</button>
            <button type="button" class="seg-btn" data-layout="stack">竖叠</button>
            <button type="button" class="seg-btn" data-layout="grid">宫格</button>
          </div>
          <div class="seg count-seg" id="countSeg" hidden role="radiogroup" aria-label="份数">
            <button type="button" class="seg-btn" data-count="2">2</button>
            <button type="button" class="seg-btn" data-count="3">3</button>
            <button type="button" class="seg-btn on" data-count="4">4</button>
          </div>
        </section>

        <section class="tool">
          <h2>画质</h2>
          <div class="seg" role="radiogroup" aria-label="画质">
            <button type="button" class="seg-btn on" data-quality="keep">原像素</button>
            <button type="button" class="seg-btn" data-quality="x">X 投稿</button>
          </div>
        </section>

        <section class="tool" id="audioTool">
          <h2>声音</h2>
          <div class="seg" role="radiogroup" aria-label="声音">
            <button type="button" class="seg-btn" data-audio="all">保留</button>
            <button type="button" class="seg-btn on" data-audio="mute">去掉</button>
          </div>
        </section>

        <section class="tool">
          <h2>文件名</h2>
          <label class="path-label">导出
            <input id="stem" type="text" value="clip" maxlength="80" spellcheck="false">
          </label>
        </section>

        <p class="warn" id="warnings" hidden></p>
        <p class="tile-spec" id="tileSpec"></p>

        <button type="button" class="blade" id="cutBtn" disabled>
          <span id="cutLabel">重封装</span>
        </button>
        <button type="button" class="ghost" id="cancelBtn" hidden>取消</button>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar" id="progressBar"></div>
          <p id="progressText">0%</p>
        </div>
      </form>
    </aside>

    <section class="stage" aria-label="切条预览">
      <div class="table">
        <div class="empty" id="empty">
          <p>把成片放上切台。</p>

        </div>
        <div class="film" id="film" hidden>
          <div class="sprocket left" aria-hidden="true"></div>
          <div class="pieces" id="pieces"></div>
          <div class="sprocket right" aria-hidden="true"></div>
        </div>
      </div>
      <p class="order" id="orderHint"></p>
    </section>

    <aside class="handset-col">
      <p class="handset-label">手机上长这样</p>
      <div class="handset" id="handset">
        <div class="notch" aria-hidden="true"></div>
        <div class="handset-screen" id="phoneScreen">
          <p class="phone-empty">拖片子进来</p>
        </div>
      </div>
    </aside>
  </main>

  <section class="results" id="results" hidden>
    <div class="results-head">
      <h2 id="resultsHead">按这个顺序上传</h2>
      <div class="results-actions">
        <a class="ghost" id="zipBtn" href="#">打包下载</a>
        <button type="button" class="ghost" id="revealBtn">打开文件夹</button>
      </div>
    </div>
    <ol class="out-list" id="outList"></ol>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
